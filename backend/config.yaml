app:
  env: development
  port: 8080
  frontend_url: "http://localhost:5173"

database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "discord2"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  max_conn_lifetime: "5m"

jwt:
  secret: "changeme-in-production-use-strong-secret"
  access_ttl: "15m"
  refresh_ttl: "168h"
  issuer: "discord2"

google_oauth:
  client_id: ""
  client_secret: ""
  redirect_url: "http://localhost:8080/api/v1/auth/google/callback"

websocket:
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_interval: "30s"
  pong_wait: "60s"

upload:
  max_size_mb: 25
  path: "./uploads"
  allowed_types:
    - "image/*"
    - "video/*"
    - "audio/*"
    - "application/pdf"

livekit:
  api_key: ""
  api_secret: ""
  ws_url: ""
  api_url: ""